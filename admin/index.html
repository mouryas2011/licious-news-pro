<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Licious News Admin</title>
<style>body{font-family:Arial;max-width:850px;margin:auto;padding:25px;background:#f5f5f5}input,textarea,select,button{width:100%;padding:12px;margin:7px 0;box-sizing:border-box}button{background:#111;color:#fff;border:0;border-radius:6px;font-weight:bold}.card{background:white;padding:18px;border-radius:10px;margin-top:15px}</style></head>
<body><h1>Licious News Admin</h1><div class="card">
<input id="key" placeholder="Admin key" type="password"><input id="title" placeholder="News headline">
<select id="cat"><option>भारत</option><option>बिजनेस</option><option>टेक</option><option>स्पोर्ट्स</option><option>दुनिया</option><option>मनोरंजन</option></select>
<textarea id="article" rows="8" placeholder="Full article / source text"></textarea><input id="url" placeholder="Original article URL">
<button onclick="publish()">AI Summarize + Publish</button><pre id="out"></pre></div>
<script>
async function publish(){
 const key=document.getElementById('key').value, title=document.getElementById('title').value, article=document.getElementById('article').value;
 const s=await fetch('http://localhost:3000/api/summarize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,article})}).then(r=>r.json());
 const n={title:s.title,summary:s.summary,cat:document.getElementById('cat').value,source:'Admin',url:document.getElementById('url').value};
 const r=await fetch('http://localhost:3000/api/admin/news',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':key},body:JSON.stringify(n)});
 document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2);
}
</script></body></html>
