name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm install

      - name: Make Gradlew Executable
        run: chmod +x mobile/android/gradlew

      - name: Build Android APK (Release or Debug)
        run: |
          cd mobile/android
          echo "=== Attempting assembleRelease ==="
          if ./gradlew assembleRelease --no-daemon --stacktrace; then
            echo "Release build succeeded!"
          else
            echo "Release build failed, falling back to standalone assembleDebug..."
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Prepare APK File
        run: |
          mkdir -p build-output
          if [ -f mobile/android/app/build/outputs/apk/release/app-release.apk ]; then
            echo "Using Release APK"
            cp mobile/android/app/build/outputs/apk/release/app-release.apk build-output/LiciousNewsPro.apk
          elif [ -f mobile/android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "Using Standalone Debug APK"
            cp mobile/android/app/build/outputs/apk/debug/app-debug.apk build-output/LiciousNewsPro.apk
          else
            echo "Error: No APK found in build outputs!"
            find mobile/android/app/build/outputs -type f || true
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiciousNewsPro-APK
          path: build-output/LiciousNewsPro.apk
          retention-days: 30

      - name: Publish GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: Licious News Pro v1.0.0 (Android APK)
          draft: false
          prerelease: false
          body: |
            ### 🎉 Licious News Pro - Android APK Ready for Download!

            Direct APK download for Android phones:
            - **Filename**: `LiciousNewsPro.apk`
            - **Platform**: Android
            - Fully working standalone APK
          files: build-output/LiciousNewsPro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
