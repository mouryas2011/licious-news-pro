name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm install

      - name: Make Gradlew Executable
        run: chmod +x mobile/android/gradlew

      - name: Build Android APK
        run: |
          cd mobile/android
          set +e
          echo "=== Running assembleRelease ==="
          ./gradlew assembleRelease --no-daemon --stacktrace > release.log 2>&1
          RELEASE_CODE=$?
          
          if [ $RELEASE_CODE -eq 0 ]; then
            echo "Release build succeeded!"
          else
            echo "Release build failed with exit code $RELEASE_CODE"
            echo "### ❌ Release Build Error Log:" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 60 release.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            
            echo "=== Running assembleDebug as Fallback ==="
            ./gradlew assembleDebug --no-daemon --stacktrace > debug.log 2>&1
            DEBUG_CODE=$?
            
            if [ $DEBUG_CODE -eq 0 ]; then
              echo "Debug build succeeded!"
            else
              echo "Debug build also failed with exit code $DEBUG_CODE"
              echo "### ❌ Debug Build Error Log:" >> $GITHUB_STEP_SUMMARY
              echo '```text' >> $GITHUB_STEP_SUMMARY
              tail -n 60 debug.log >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              
              echo "==================== FULL ERROR OUTPUT ===================="
              tail -n 100 debug.log
              echo "==========================================================="
              exit 1
            fi
          fi

      - name: Prepare APK File
        run: |
          mkdir -p build-output
          echo "Searching for generated APK files..."
          find mobile/android -type f -name "*.apk" || true
          
          APK_PATH=$(find mobile/android -type f -name "*.apk" | grep -v "unaligned" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find mobile/android -type f -name "*.apk" | head -n 1)
          fi
          
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "Selected APK: $APK_PATH"
            cp "$APK_PATH" build-output/LiciousNewsPro.apk
            echo "APK ready:"
            ls -lh build-output/LiciousNewsPro.apk
          else
            echo "ERROR: No APK found anywhere in mobile/android!"
            find mobile/android/app/build -maxdepth 5 || true
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiciousNewsPro-APK
          path: build-output/LiciousNewsPro.apk
          retention-days: 30

      - name: Publish GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: Licious News Pro v1.0.0 (Android APK)
          draft: false
          prerelease: false
          body: |
            ### 🎉 Licious News Pro - Android APK Ready for Download!

            Direct APK download for Android phones:
            - **Filename**: `LiciousNewsPro.apk`
            - **Platform**: Android
            - Fully working standalone APK
          files: build-output/LiciousNewsPro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
